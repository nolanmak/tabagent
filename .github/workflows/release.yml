# Manual release (#23). Builds, checks versions, zips the Web Store build of the
# extension, and publishes the `tabagent` npm package with the NPM_TOKEN secret.
# The Web Store upload itself is manual (see docs/release.md). Do not run before
# M3 is closed (D17).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version being released, e.g. v0.2.0 (must match every package/manifest version)"
        required: true
      dry_run:
        description: "Run npm publish with --dry-run"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Socket Firewall in front of npm, npx and pnpm (github-ci-security)
        if: runner.os == 'Linux'
        run: bash .github/security/install-tools.sh sfw
      - run: npm ci
      - run: npm run check-versions -- --tag "${{ inputs.tag }}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      # Store build: same code, no dev `key` (the Web Store assigns the id).
      - name: Build extension for the Web Store
        run: TABAGENT_STORE_BUILD=1 npm run build -w @tabagent/extension
      - name: Zip extension
        run: |
          mkdir -p release
          (cd packages/extension/dist && zip -r -X "../../../release/tabagent-extension-${{ inputs.tag }}.zip" .)
      - name: Check zipped manifest permissions match the justifications
        run: ./node_modules/.bin/vitest run --project release test/release/store-permissions.test.ts

      # npm build: the bridge bundles the dev-keyed extension for `tabagent extension path`.
      - run: npm run build
      - run: npm run test:release

      - uses: actions/upload-artifact@v4
        with:
          name: tabagent-extension-${{ inputs.tag }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish to npm
        run: npm publish -w @nolmak/tabagent --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

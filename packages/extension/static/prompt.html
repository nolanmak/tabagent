<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TabAgent — permission</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body class="prompt">
<main id="box" role="alertdialog" aria-labelledby="title" aria-describedby="detail">
  <div class="eyebrow"><img src="icons/32.png" alt="" width="18" height="18" /> TabAgent needs your approval</div>
  <h1 id="title">Loading…</h1>
  <p id="detail"></p>
  <ul id="reasons" class="reasons"></ul>
  <p class="muted small" id="tool"></p>
  <div class="actions">
    <button id="deny" class="ghost">Deny</button>
    <button id="always" class="secondary">Always allow</button>
    <button id="once" class="primary">Allow once</button>
  </div>
  <div class="timer" id="timer" aria-hidden="true"><span></span></div>
  <p class="muted small" id="countdown"></p>
</main>
<script src="prompt.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat · TabAgent</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body class="chat-page">
<header class="chat-head">
  <div class="chat-head-inner">
    <img src="icons/32.png" alt="" width="22" height="22" class="chat-logo" />
    <div class="head-main">
      <div class="head-title"><span id="vendor" class="vendor" hidden></span><h1 id="title">Loading…</h1></div>
      <div id="folder" class="head-sub muted small"></div>
    </div>
    <div class="head-side">
      <span id="status" class="status-pill" hidden></span>
      <span id="conn" class="conn" hidden></span>
      <a id="rcBtn" class="btn primary small-btn" target="_blank" rel="noopener noreferrer" title="Open this session in Claude (Remote Control)" hidden>Open in Claude ↗</a>
    </div>
  </div>
</header>
<main id="scroller" class="chat-scroll">
  <div class="chat-inner">
    <div class="older"><button id="loadOlder" type="button" class="secondary" hidden>Load earlier messages</button></div>
    <div id="notice" class="chat-notice" role="status" hidden></div>
    <div id="log" class="chat-log" role="log" aria-label="Conversation" aria-live="polite"></div>
    <div id="pending" class="chat-log" aria-live="polite"></div>
    <div id="typing" class="typing" hidden><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="muted small">Working…</span></div>
  </div>
</main>
<button id="newPill" type="button" class="new-pill" hidden>New messages ↓</button>
<footer class="chat-foot">
  <div class="chat-inner">
    <form id="composer" class="composer-box" hidden>
      <textarea id="input" rows="1" placeholder="Message this session…" aria-label="Message"></textarea>
      <button id="sendBtn" class="primary send-btn" type="submit" disabled>Send</button>
    </form>
    <div id="composerOpts" class="composer-opts small" hidden>
      <label class="share"><span class="muted">Share a tab</span> <select id="shareTab" aria-label="Share a tab"><option value="">None</option></select></label>
      <span id="routeHint" class="muted"></span>
      <button type="button" id="spawnCancel" class="link" hidden>Cancel</button>
    </div>
    <div id="composerNote" class="small err" hidden></div>
    <div id="card" hidden></div>
  </div>
</footer>
<script src="chat.js"></script>
</body>
</html>

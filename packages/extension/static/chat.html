<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat · TabAgent</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body class="chat-page">
<div class="chat-shell">
<aside id="rail" class="chat-rail" aria-label="Sessions">
  <div class="rail-head"><img src="icons/32.png" alt="" width="20" height="20" /> TabAgent</div>
  <div class="rail-label">Sessions</div>
  <ul id="railList" class="rail-list"><li class="rail-empty">Looking for sessions…</li></ul>
</aside>
<div class="chat-main">
<header class="chat-head">
  <div class="chat-head-inner">
    <img src="icons/32.png" alt="" width="20" height="20" class="chat-logo" />
    <div class="head-main">
      <div class="head-title"><button id="pickerBtn" type="button" class="picker-btn" aria-expanded="false" aria-controls="pickerList" hidden></button><h1 id="title">Loading…</h1><span id="vendor" class="vendor" hidden></span></div>
      <div id="folder" class="head-sub"></div>
    </div>
    <div class="head-side">
      <span id="status" class="status-pill" hidden></span>
      <span id="conn" class="conn" hidden></span>
      <a id="rcBtn" class="btn primary sm" target="_blank" rel="noopener noreferrer" title="Open this session in Claude (Remote Control)" hidden>Open in Claude ↗</a>
    </div>
  </div>
  <ul id="pickerList" class="picker-list" aria-label="Sessions" hidden></ul>
</header>
<main id="scroller" class="chat-scroll">
  <div class="chat-inner">
    <div class="older"><button id="loadOlder" type="button" class="secondary sm" hidden>Load earlier messages</button></div>
    <div id="notice" class="chat-notice" role="status" hidden></div>
    <div id="log" class="chat-log" role="log" aria-label="Conversation" aria-live="polite"></div>
    <div id="pending" class="chat-log" aria-live="polite"></div>
    <div id="typing" class="typing" hidden><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="small">Working…</span></div>
  </div>
</main>
<button id="newPill" type="button" class="new-pill sm" hidden>New messages ↓</button>
<footer class="chat-foot">
  <div class="chat-inner">
    <form id="composer" class="composer-box" hidden>
      <div id="editBanner" class="edit-banner" hidden></div>
      <textarea id="input" rows="1" placeholder="Message this session…" aria-label="Message" aria-keyshortcuts="Meta+K Control+K /"></textarea>
      <div class="composer-bar">
        <div id="composerOpts" class="composer-opts" hidden>
          <label class="share"><span>Share</span><select id="shareTab" aria-label="Share a tab"><option value="">No tab</option></select></label>
          <span id="routeHint"></span>
          <button type="button" id="spawnCancel" class="link" hidden>Cancel</button>
        </div>
        <button id="sendBtn" class="primary send-btn" type="submit" disabled>Send</button>
      </div>
    </form>
    <div id="composerHints" class="composer-hints" hidden><span><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span><span><span id="recallHint" hidden><kbd>↑</kbd> to edit your last · </span><kbd id="focusKey">⌘K</kbd> or <kbd>/</kbd> to focus · <kbd>Esc</kbd> to leave</span></div>
    <div id="composerNote" class="small err" hidden></div>
    <div id="card" hidden></div>
  </div>
</footer>
</div>
</div>
<script src="chat.js"></script>
</body>
</html>

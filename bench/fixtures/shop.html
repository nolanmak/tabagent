<!doctype html>
<meta charset="utf-8" />
<title>Shop</title>
<script src="bench.js"></script>
<h1>Shop</h1>
<ul>
  <li>Widget $12.50 <label>Qty <input id="q-widget" type="number" value="1" min="1" /></label> <button data-item="Widget">Add Widget to cart</button></li>
  <li>Gadget $99.00 <label>Qty <input id="q-gadget" type="number" value="1" min="1" /></label> <button data-item="Gadget">Add Gadget to cart</button></li>
</ul>
<a href="cart.html">View cart</a>
<script>
  document.querySelectorAll("button[data-item]").forEach((b) =>
    b.addEventListener("click", () => {
      const item = b.dataset.item;
      const qty = Number(document.getElementById(`q-${item.toLowerCase()}`).value);
      const cart = bench.get().cart || [];
      cart.push({ item, qty });
      bench.set({ cart });
    }),
  );
</script>

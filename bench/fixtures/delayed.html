<!doctype html>
<meta charset="utf-8" />
<title>Search</title>
<script src="bench.js"></script>
<h1>Search flights</h1>
<label>From <input id="from" /></label>
<button id="go">Search</button>
<div id="results" aria-live="polite"></div>
<script>
  document.getElementById("go").addEventListener("click", () => {
    const from = document.getElementById("from").value;
    document.getElementById("results").textContent = "Searching…";
    setTimeout(() => {
      const n = from.trim().toUpperCase() === "SFO" ? 17 : 0;
      document.getElementById("results").innerHTML = `<p id="count">${n} flights found from ${from}</p>`;
      bench.set({ searched: from });
    }, 1500);
  });
</script>

<!doctype html>
<meta charset="utf-8" />
<title>Account actions</title>
<script src="bench.js"></script>
<h1>Account actions</h1>
<button id="archive">Archive account</button>
<button id="rename">Set display name</button>
<p id="out" role="status"></p>
<script>
  document.getElementById("archive").addEventListener("click", () => {
    const ok = confirm("Archive this account?");
    bench.set({ archived: ok });
    document.getElementById("out").textContent = ok ? "Archived" : "Kept";
  });
  document.getElementById("rename").addEventListener("click", () => {
    const v = prompt("Display name?", "");
    bench.set({ displayName: v });
    document.getElementById("out").textContent = v === null ? "Cancelled" : `Name: ${v}`;
  });
</script>

<!doctype html>
<meta charset="utf-8" />
<title>Cart</title>
<script src="bench.js"></script>
<h1>Your cart</h1>
<ul id="lines"></ul>
<form id="f">
  <label>Street <input name="street" required /></label>
  <label>City <input name="city" required /></label>
  <button type="submit">Place order</button>
</form>
<p id="msg" role="status"></p>
<script>
  const cart = bench.get().cart || [];
  document.getElementById("lines").innerHTML = cart.length ? cart.map((l) => `<li>${l.qty} × ${l.item}</li>`).join("") : "<li>Cart is empty</li>";
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    bench.set({ order: { lines: bench.get().cart || [], ...bench.formData(e.target) } });
    document.getElementById("msg").textContent = "Order placed";
  });
</script>

<!doctype html>
<meta charset="utf-8" />
<title>Shipping details</title>
<script src="bench.js"></script>
<h1>Shipping</h1>
<form id="f">
  <label>Country
    <select name="country">
      <option value="">Choose…</option>
      <option value="us">United States</option>
      <option value="ca">Canada</option>
      <option value="fr">France</option>
    </select>
  </label>
  <fieldset>
    <legend>Speed</legend>
    <label><input type="radio" name="speed" value="standard" checked /> Standard</label>
    <label><input type="radio" name="speed" value="express" /> Express</label>
  </fieldset>
  <button type="submit">Save shipping</button>
</form>
<p id="msg" role="status"></p>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    bench.set({ shipping: bench.formData(e.target) });
    document.getElementById("msg").textContent = "Saved";
  });
</script>

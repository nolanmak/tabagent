<!doctype html>
<meta charset="utf-8" />
<title>Products</title>
<script src="bench.js"></script>
<h1>Products</h1>
<table id="t">
  <thead>
    <tr><th><button data-key="name">Name</button></th><th><button data-key="price">Price</button></th><th>Qty</th></tr>
  </thead>
  <tbody></tbody>
</table>
<script>
  const rows = [
    { name: "Widget", price: 12.5, qty: 10 },
    { name: "Gadget", price: 99.0, qty: 3 },
    { name: "Doohickey", price: 7.25, qty: 14 },
    { name: "Sprocket", price: 45.0, qty: 8 },
    { name: "Gizmo", price: 30.0, qty: 7 },
  ];
  let dir = {};
  function render() {
    document.querySelector("#t tbody").innerHTML = rows
      .map((r) => `<tr><td>${r.name}</td><td>$${r.price.toFixed(2)}</td><td>${r.qty}</td></tr>`)
      .join("");
  }
  document.querySelectorAll("th button").forEach((b) =>
    b.addEventListener("click", () => {
      const k = b.dataset.key;
      dir[k] = dir[k] === "asc" ? "desc" : "asc";
      rows.sort((a, c) => (a[k] > c[k] ? 1 : -1) * (dir[k] === "asc" ? 1 : -1));
      render();
      bench.set({ sort: `${k}-${dir[k]}`, firstRow: rows[0].name });
    }),
  );
  render();
</script>

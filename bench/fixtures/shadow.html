<!doctype html>
<meta charset="utf-8" />
<title>Preferences</title>
<script src="bench.js"></script>
<h1>Preferences</h1>
<pref-toggle></pref-toggle>
<script>
  customElements.define(
    "pref-toggle",
    class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `<label><input type="checkbox" id="dark"> Dark mode</label> <button id="save">Save preferences</button>`;
        root.getElementById("save").addEventListener("click", () => bench.set({ prefs: { dark: root.getElementById("dark").checked } }));
      }
    },
  );
</script>

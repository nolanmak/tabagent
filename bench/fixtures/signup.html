<!doctype html>
<meta charset="utf-8" />
<title>Newsletter signup</title>
<script src="bench.js"></script>
<h1>Join the newsletter</h1>
<form id="f">
  <label>Full name <input name="name" required /></label>
  <label>Email <input name="email" type="email" required /></label>
  <label><input name="newsletter" type="checkbox" /> Send me the weekly newsletter</label>
  <label><input name="terms" type="checkbox" required /> I accept the terms</label>
  <button type="submit">Sign up</button>
</form>
<p id="msg" role="status"></p>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const data = bench.formData(e.target);
    bench.set({ signup: data });
    document.getElementById("msg").textContent = `Thanks, ${data.name}!`;
  });
</script>

<!doctype html><html><head><title>Dialogs</title></head><body><main>
<button id="c" onclick="document.getElementById('r').textContent = confirm('Really do it?') ? 'confirmed' : 'cancelled'">Ask confirm</button>
<button id="p" onclick="document.getElementById('r').textContent = 'name=' + prompt('Your name?', 'x')">Ask prompt</button>
<p id="r"></p></main></body></html>

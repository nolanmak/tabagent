<!doctype html><html><head><title>Modal</title>
<style>#overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
#overlay .box{background:#fff;padding:20px}</style></head><body><main>
<h1>Behind the modal</h1>
<button id="target" onclick="document.getElementById('out').textContent='target clicked'">Target</button>
<p id="out"></p>
</main>
<div id="overlay" class="cookie-banner"><div class="box" role="dialog" aria-label="Cookies">We use cookies <button onclick="document.getElementById('overlay').remove()">Accept cookies</button></div></div>
</body></html>

<!doctype html><html><head><title>Waiting</title></head><body><main>
<h1>Waiting page</h1>
<label for="q">Query</label> <input id="q">
<script>
setTimeout(() => {
  const b = document.createElement('button'); b.id = 'late'; b.textContent = 'Appeared later';
  b.onclick = () => { b.textContent = 'Late clicked'; };
  document.querySelector('main').appendChild(b);
  const p = document.createElement('p'); p.textContent = 'Content arrived'; document.querySelector('main').appendChild(p);
  history.pushState({}, '', '/wait.html?step=2');
}, 700);
</script></main></body></html>

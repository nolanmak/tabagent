<!doctype html><html><head><title>Listing</title></head><body><main>
<h1>Catalog <span id="pg"></span></h1>
<table id="t"><thead><tr><th>Name</th><th>Price</th></tr></thead><tbody id="tb"></tbody></table>
<ul id="cards"></ul>
<nav aria-label="pagination"><a id="prev" href="#">Previous</a> <a id="next" rel="next" href="#">Next</a></nav>
</main>
<script>
const page = +(new URLSearchParams(location.search).get('page') || 1);
document.getElementById('pg').textContent = '(page ' + page + ' of 4)';
let html = '', cards = '';
for (let i = 0; i < 3; i++) {
  const n = 'Item ' + ((page - 1) * 3 + i + 1);
  const price = ((page - 1) * 3 + i + 1) * 2;
  html += `<tr><td>${n}</td><td>$${price}.00</td></tr>`;
  cards += `<li class="card"><h3 class="card-title">${n}</h3><span class="card-price">$${price}.00</span><a class="card-link" href="/p/item-${(page - 1) * 3 + i + 1}">View</a></li>`;
}
document.getElementById('tb').innerHTML = html;
document.getElementById('cards').innerHTML = cards;
const nx = document.getElementById('next');
if (page < 4) nx.href = '?page=' + (page + 1); else { nx.removeAttribute('href'); nx.setAttribute('aria-disabled', 'true'); }
</script></body></html>

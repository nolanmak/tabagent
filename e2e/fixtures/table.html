<!doctype html><html><head><title>Products</title></head><body><main>
<h1>Products <span id="pg"></span></h1>
<table id="t"><thead><tr><th>Name</th><th>Price</th><th>Stock</th></tr></thead><tbody id="tb"></tbody></table>
<div id="cards"></div>
<nav aria-label="pagination"><a id="next" href="#">Next</a></nav>
<table><tr><td>tiny</td></tr></table>
</main>
<script>
const page = +(new URLSearchParams(location.search).get('page') || 1);
document.getElementById('pg').textContent = '(page ' + page + ')';
const names = ['Apple','Banana','Cherry','Date','Elder','Fig','Grape','Honeydew','Kiwi'];
let html = '', cards = '';
for (let i = 0; i < 3; i++) {
  const n = names[(page-1)*3 + i]; const price = ((page-1)*3+i+1) * 1.5;
  html += `<tr><td>${n}</td><td>$${price.toFixed(2)}</td><td>${i%2? 'yes':'no'}</td></tr>`;
  cards += `<div class="product-card"><h3 class="title">${n}</h3><span class="price">$${price.toFixed(2)}</span><a class="link" href="/p/${n.toLowerCase()}">View</a></div>`;
}
document.getElementById('tb').innerHTML = html;
document.getElementById('cards').innerHTML = cards;
const nx = document.getElementById('next');
if (page < 3) nx.href = '?page=' + (page+1); else nx.remove();
</script></body></html>

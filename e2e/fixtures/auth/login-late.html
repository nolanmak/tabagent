<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture sign in (late form)</title></head>
<body>
<h1>Sign in to Fixture</h1>
<div id="slot"></div>
<script>
  // The form is created after load, the way single-page apps render it.
  setTimeout(() => {
    document.getElementById("slot").innerHTML = `
      <form id="login" method="post" action="/auth/login">
        <label for="username">Email</label>
        <input id="username" name="username" type="email" autocomplete="username">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button id="submit" type="submit">Sign in</button>
      </form>`;
  }, 1500);
</script>
</body>
</html>

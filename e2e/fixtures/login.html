<!doctype html><html><head><title>Log in</title></head><body><main>
<h1>Log in</h1>
<form id="login" onsubmit="event.preventDefault(); document.getElementById('status').textContent='SUBMITTED ' + document.getElementById('u').value">
  <label for="u">Username</label><input id="u" name="username" autocomplete="username">
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
<form id="search" role="search" onsubmit="event.preventDefault(); document.getElementById('status').textContent='SEARCHED'">
  <label for="q">Search</label><input id="q" name="q" type="search">
</form>
<p id="status">IDLE</p>
</main></body></html>

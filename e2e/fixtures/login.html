<!doctype html><html><head><title>Login</title></head><body><main>
<h1>Sign in</h1>
<form id="login" onsubmit="event.preventDefault(); document.getElementById('status').textContent='SUBMITTED'">
 <label for="user">Username</label><input id="user" name="username" autocomplete="username">
 <label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password">
 <button type="submit">Sign in</button>
</form>
<p id="status">NOT SUBMITTED</p>
</main></body></html>

<!doctype html><html><head><title>Network</title></head><body><main>
<button onclick="fetch('/api/data.json').then(r=>r.json()).then(j=>{document.getElementById('o').textContent=j.items.join(',');console.log('loaded', j.items.length)})">Load data</button>
<button onclick="setTimeout(() => fetch('/api/data.json?late=1', {method: 'POST', body: 'x=1'}), 400)">Post later</button>
<button onclick="console.error('boom happened')">Log error</button>
<p id="o"></p></main>
<script>fetch('/api/data.json?onload=1'); console.log('page ready');</script>
</body></html>

<!doctype html><html><head><title>Drag</title>
<style>#src,#dst{width:120px;height:60px;border:2px dashed #555;margin:10px;display:inline-block}</style></head><body><main>
<div id="src" draggable="true" role="button" aria-label="Drag source">Drag me</div>
<div id="dst" role="region" aria-label="Drop zone">Drop here</div>
<p id="out"></p>
<script>
src.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', 'payload-1'));
dst.addEventListener('dragover', e => e.preventDefault());
dst.addEventListener('drop', e => { e.preventDefault(); document.getElementById('out').textContent = 'dropped ' + e.dataTransfer.getData('text/plain'); });
</script></main></body></html>

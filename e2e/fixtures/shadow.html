<!doctype html><html><head><title>Shadow</title></head><body><main>
<h1>Shadow DOM</h1>
<my-widget></my-widget>
<p id="out"></p>
<script>
customElements.define('my-widget', class extends HTMLElement {
  connectedCallback(){
    const r = this.attachShadow({mode:'open'});
    r.innerHTML = '<label>Shadow input <input id="si"></label> <button id="sb">Shadow button</button>';
    r.getElementById('sb').onclick = () => document.getElementById('out').textContent = 'shadow:' + r.getElementById('si').value;
  }
});
</script></main></body></html>

<!doctype html><html><head><title>React form</title></head><body><main>
<h1>Controlled form</h1>
<form id="f" onsubmit="event.preventDefault(); document.getElementById('out').textContent = 'submitted ' + JSON.stringify(state)">
  <label for="name">Name</label> <input id="name">
  <label for="city">City</label> <input id="city">
  <button type="submit">Save</button>
</form>
<p id="out"></p>
</main>
<script>
// Emulates React's controlled inputs: the page keeps `state`, re-renders the
// DOM value from state after every event, and React's value tracker ignores
// programmatic sets made through the instance's own setter (page world).
const state = { name: '', city: '' };
for (const id of ['name', 'city']) {
  const el = document.getElementById(id);
  let tracked = '';
  const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  Object.defineProperty(el, 'value', {
    get() { return proto.get.call(this); },
    set(v) { tracked = String(v); proto.set.call(this, v); },
    configurable: true,
  });
  el.addEventListener('input', () => {
    const cur = proto.get.call(el);
    if (cur === tracked) return; // React: no change detected
    tracked = cur;
    state[id] = cur;
    // re-render from state on the next tick, like a React commit
    setTimeout(() => { el.value = state[id]; document.getElementById('out').textContent = 'state ' + JSON.stringify(state); }, 0);
  });
}
</script></body></html>

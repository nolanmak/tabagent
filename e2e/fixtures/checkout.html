<!doctype html><html><head><title>Checkout</title></head><body><main>
<h1>Checkout</h1>
<form id="pay" onsubmit="event.preventDefault(); document.getElementById('status').textContent='PAID'">
 <label for="cc">Card number</label><input id="cc" name="cardnumber" autocomplete="cc-number">
 <label for="name">Name on card</label><input id="name" name="ccname" autocomplete="cc-name">
 <button type="submit">Pay $42.00</button>
</form>
<button id="del" onclick="document.getElementById('status').textContent='DELETED'">Delete account</button>
<p id="status">UNPAID</p>
</main></body></html>
